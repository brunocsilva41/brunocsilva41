<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Core Languages and Production Stack">
  <title>Core Languages and Production Stack</title>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif;
      fill: #ff79c6;
    }
    .lang-name {
      font: 600 13px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif;
      fill: #f8f8f2;
    }
    .lang-percent {
      font: 400 12px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif;
      fill: #6272a4;
    }
    .footer-note {
      font: 400 11px 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, sans-serif;
      fill: #6272a4;
      font-style: italic;
    }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" rx="6" height="194" width="494" fill="#282a36" stroke="#44475a" stroke-width="1"/>

  <!-- Title -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Core Languages &amp; Production Stack</text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(25, 52)">
    <mask id="bar-mask">
      <rect x="0" y="0" width="445" height="10" fill="white" rx="5"/>
    </mask>

    <g mask="url(#bar-mask)">
      <rect x="0" y="0" width="169.1" height="10" fill="#3178c6"/>
      <rect x="169.1" y="0" width="89" height="10" fill="#00add8"/>
      <rect x="258.1" y="0" width="66.75" height="10" fill="#dea584"/>
      <rect x="324.85" y="0" width="53.4" height="10" fill="#f1e05a"/>
      <rect x="378.25" y="0" width="35.6" height="10" fill="#239120"/>
      <rect x="413.85" y="0" width="31.15" height="10" fill="#777bb4"/>
    </g>
  </g>

  <!-- Legend Items Grid -->
  <!-- Row 1 -->
  <g transform="translate(25, 95)">
    <circle cx="6" cy="6" r="5" fill="#3178c6"/>
    <text x="18" y="10" class="lang-name">TypeScript <tspan class="lang-percent">38%</tspan></text>
  </g>

  <g transform="translate(190, 95)">
    <circle cx="6" cy="6" r="5" fill="#00add8"/>
    <text x="18" y="10" class="lang-name">Go <tspan class="lang-percent">20%</tspan></text>
  </g>

  <g transform="translate(350, 95)">
    <circle cx="6" cy="6" r="5" fill="#dea584"/>
    <text x="18" y="10" class="lang-name">Rust <tspan class="lang-percent">15%</tspan></text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(25, 128)">
    <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
    <text x="18" y="10" class="lang-name">Python <tspan class="lang-percent">12%</tspan></text>
  </g>

  <g transform="translate(190, 128)">
    <circle cx="6" cy="6" r="5" fill="#239120"/>
    <text x="18" y="10" class="lang-name">C# / .NET <tspan class="lang-percent">8%</tspan></text>
  </g>

  <g transform="translate(350, 128)">
    <circle cx="6" cy="6" r="5" fill="#777bb4"/>
    <text x="18" y="10" class="lang-name">PHP <tspan class="lang-percent">7%</tspan></text>
  </g>

  <!-- Footer note -->
  <g transform="translate(25, 168)">
    <text x="0" y="0" class="footer-note">⚡ Consolidado de código em produção, microsserviços, desktop agents e sistemas autorais</text>
  </g>
</svg>